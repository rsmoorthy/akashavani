services:
  api:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: akashavani-server:dev
    ports:
      - "8000:8000"
    environment:
      AKASHAVANI_ENVIRONMENT: development
      AKASHAVANI_DATABASE_URL: sqlite:////data/akashavani.db
      AKASHAVANI_DATA_DIR: /data
      AKASHAVANI_FIRMWARE_DIR: /data/firmware
      AKASHAVANI_DEVICE_SEEDS: ${AKASHAVANI_DEVICE_SEEDS:-sim-001:dev-sim-token:Simulator,station-1:dev-station-1-token:Bench station 1}
      AKASHAVANI_ADMIN_TOKEN: ${AKASHAVANI_ADMIN_TOKEN:-dev-admin-token}
      AKASHAVANI_API_TOKEN: ${AKASHAVANI_API_TOKEN:-secret}
      AKASHAVANI_RAIN_BUCKET_MM: ${AKASHAVANI_RAIN_BUCKET_MM:-0.254}
      AKASHAVANI_LOG_LEVEL: ${AKASHAVANI_LOG_LEVEL:-INFO}
      AKASHAVANI_PUBLIC_DASHBOARD_ENABLED: ${AKASHAVANI_PUBLIC_DASHBOARD_ENABLED:-false}
      AKASHAVANI_PUBLIC_DEFAULT_SLUG: ${AKASHAVANI_PUBLIC_DEFAULT_SLUG:-}
      AKASHAVANI_PUBLIC_DEVICE_IDS: ${AKASHAVANI_PUBLIC_DEVICE_IDS:-}
      AKASHAVANI_PUBLIC_MAX_RANGE_DAYS: ${AKASHAVANI_PUBLIC_MAX_RANGE_DAYS:-31}
      AKASHAVANI_PUBLIC_CACHE_SECONDS: ${AKASHAVANI_PUBLIC_CACHE_SECONDS:-60}
      AKASHAVANI_DASHBOARD_DIR: ${AKASHAVANI_DASHBOARD_DIR:-/app/dashboard/dist}
    volumes:
      - ./data:/data
    restart: unless-stopped
