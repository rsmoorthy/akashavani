services:
  api:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: akashvani-server:dev
    ports:
      - "8000:8000"
    environment:
      AKASHVANI_ENVIRONMENT: development
      AKASHVANI_DATABASE_URL: sqlite:////data/akashvani.db
      AKASHVANI_DATA_DIR: /data
      AKASHVANI_FIRMWARE_DIR: /data/firmware
      AKASHVANI_DEVICE_SEEDS: ${AKASHVANI_DEVICE_SEEDS:-sim-001:dev-sim-token:Simulator,station-1:dev-station-1-token:Bench station 1}
      AKASHVANI_ADMIN_TOKEN: ${AKASHVANI_ADMIN_TOKEN:-dev-admin-token}
      AKASHVANI_API_TOKEN: ${AKASHVANI_API_TOKEN:-secret}
      AKASHVANI_SITE_LATITUDE: ${AKASHVANI_SITE_LATITUDE:-13.4867}
      AKASHVANI_SITE_LONGITUDE: ${AKASHVANI_SITE_LONGITUDE:-77.7064}
      AKASHVANI_SITE_ALTITUDE_M: ${AKASHVANI_SITE_ALTITUDE_M:-940}
      AKASHVANI_SITE_TIMEZONE: ${AKASHVANI_SITE_TIMEZONE:-Asia/Kolkata}
      AKASHVANI_RAIN_BUCKET_MM: ${AKASHVANI_RAIN_BUCKET_MM:-0.254}
      AKASHVANI_LOG_LEVEL: ${AKASHVANI_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
    restart: unless-stopped
