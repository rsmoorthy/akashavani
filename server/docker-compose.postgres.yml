services:
  api:
    environment:
      AKASHVANI_DATABASE_URL: postgresql+psycopg://akashvani:akashvani@db:5432/akashvani
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akashvani
      POSTGRES_USER: akashvani
      POSTGRES_PASSWORD: akashvani
    volumes:
      - akashvani-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akashvani -d akashvani"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  akashvani-pg:
