services:
  api:
    environment:
      AKASHAVANI_DATABASE_URL: postgresql+psycopg://akashavani:akashavani@db:5432/akashavani
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akashavani
      POSTGRES_USER: akashavani
      POSTGRES_PASSWORD: akashavani
    volumes:
      - akashavani-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akashavani -d akashavani"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  akashavani-pg:
