[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "akashvani-server"
version = "0.1.0"
description = "Akashvani weather-data ingest, command and OTA API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "SQLAlchemy>=2.0.35,<2.1",
  "alembic>=1.13,<2.0",
  "cbor2>=5.6,<6.0",
  "packaging>=24.0,<26",
  "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<0.9",
  "mkdocs-material>=9.5,<10",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/akashvani_server"]
force-include = { "src/akashvani_server/admin_ui.html" = "akashvani_server/admin_ui.html" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies are declared in argument defaults by design.
"src/akashvani_server/api/*.py" = ["B008"]
"src/akashvani_server/security.py" = ["B008"]
# Generated Alembic revisions are not hand-formatted.
"migrations/**" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
